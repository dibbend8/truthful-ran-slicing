not_claimed:
- that a learned controller allocates better than a model-based optimizer
- incentive guarantees against opponents who react to the tenant's past reports, or for TCP / adaptive-bitrate traffic
- that the declared service value equals tenants' true willingness to pay
- that 3GPP or O-RAN standardizes a per-interval tenant demand report or its billing (the interface is proposed)
- protection against collusion between tenants
- multi-cell operation
- that this is the first work on strategic influence on learning (Dai et al. and others precede it)
- '''first'' anything (first truthful learned controller / first strategy-proof learned slicing): SP-RL (stein2020strategyproof) is an exactly
  strategyproof RL allocator; Fu-Kozat and Chen et al. combine learning with VCG in wireless/slicing'
- that a misreport's effect on later learning (the training channel) is a new phenomenon (Dai et al. 'indirect impact'; Amin et al.; Golrezaei
  et al.)
- that envelope / full-decision pricing is a new payment theorem (Myerson; Archer-Tardos; Milgrom-Segal) — the premium decomposition is envelope
  accounting
- that training on measurements instead of reports is new ('use the meter' is standard; the novelty is the scoped combination with priced reports)
- that existing learned mechanisms are only approximately truthful (RochetNet, MyersonNet, AMA, GemNet, SP-RL are exact); contrast instead on
  dependence on the agent's OWN report and on the report-dependent contract fill
- 'that a coordinatewise-monotone neural network suffices (Prop. heads: neither sufficient nor necessary)'
- that learned slicing work ignores tenant misreporting (ayepah2024blockchain acknowledges it); the gap is a dominant-strategy guarantee for reports
  read by the operator's learner
- 'that the water-filling monotonicity lemmas are new (uniform/allotment rules: sprumont1991division, barbera1997strategy)'
- scalability beyond what E6 measures (n = 6, 9)
novelty_positioning:
  source: lit/novelty_statement.md (2026-10-19)
  defensible:
  - N1 Theorem 1 (a)<=>(b) uniformly over contracts + explicit witness contract K* + any-payment impossibility; (b)<=>(c) credited to Myerson/Archer-Tardos/Milgrom/Rochet
  - N2 Corollary 1 + Proposition on output heads (relative cross-agent sign rule; monotone nets neither sufficient nor necessary)
  - 'N3 priority premium: sign, monotonicity, fixed-priority price DSIC iff T==0, tight bound (envelope accounting, not a new payment theorem)'
  - 'N4 horizon theorem scope: assumption table + a counterexample per assumption (positive part is folklore-level; no ''to our knowledge'' on
    it)'
  - N5 O-RAN-mappable mechanism evaluated on traces and 5G-LENA (pending E1-E7)
  must_cite_and_separate:
  - stein2020strategyproof (SP-RL)
  - wang2024gemnet
  - ayepah2024blockchain
  - curry2023differentiable
  - duan2023scalable
  - luong2018optimal
  - dai2025iapd/dai2026efficiency
  - zheng2023constrained (GREET)
  - fu2013stochastic
  - sprumont1991division
  - barbera1997strategy
  to_our_knowledge_sentence: To our knowledge, no prior work characterizes which report-dependent learned priority maps, composed with a contract-constrained
    water-filling allocator, admit truthful payments for every contract.
  theorem1_vs_myerson_sentence: Statements (b)<=>(c) are the classical single-parameter characterization [Myerson; Archer-Tardos; Milgrom]; our
    contribution is (a)<=>(b), which identifies, uniformly over contracts, which learned priority maps keep the contract allocation monotone,
    and shows by construction that violations cannot be repaired by any payment rule.
