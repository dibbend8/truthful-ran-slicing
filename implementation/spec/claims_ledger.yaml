question: 'How can a learning-based slice controller use tenants'' demand reports so that truthful reporting is each tenant''s best choice in
  the current allocation interval and in later ones, and what does this protection cost?

  '
central_claim:
  id: CC
  text: 'A learned slice controller can use tenants'' demand reports safely if (i) its priority map satisfies the own-ratio condition of Theorem
    1, (ii) it charges the full-decision price, and (iii) it is retrained only on released measurements. Without these, tenants profit from misreporting
    and honest slices lose service; with them, misreporting never pays and the protection has a measured, modest cost.

    '
  evidence:
  - T1
  - P3
  - T2
  - E2
  - E3
  - E4
  status: pending
claims:
- id: C1
  text: 'Theorem 1: a priority map admits truthful payments for every contract iff no tenant''s report raises another active tenant''s weight
    relative to its own; otherwise no payment rule of any kind works.'
  evidence:
    proof: theory/theory.tex#thm:characterization
    witness: theory/test_witnesses.py::test_thm1_*
  falsifier: a fuzzed contract/map pair satisfying the condition with a quota decrease, or a violating map with a truthful payment
  status: pending
- id: C2
  text: 'Corollary 1: for softmax score networks y=a(c)+Lambda(c)psi(z) the condition is Lambda_ii >= Lambda_ji; own-report score networks qualify
    for every parameter value and any n.'
  evidence:
    proof: theory/theory.tex#cor:design
    experiment: E2 (non-monotonicity rate of the unconstrained network)
  status: pending
- id: C3
  text: 'Proposition 3: full-decision price = fixed-priority price + priority premium T>=0 (nondecreasing); under the fixed-priority price under-reporting
    never pays and over-reporting gains at most T(z)-T(theta), tightly.'
  evidence:
    proof: theory/theory.tex#prop:premium
    example: closed-form E3 example
    experiment: E3
  status: pending
- id: C4
  text: 'Theorem 2: with exogenous traffic and counters, retraining only on released measurements, non-reactive opponents and additive utility,
    truthful reporting maximizes total utility against any adaptive strategy; the three system conditions (exogenous traffic and counters,
    measurement-only retraining, non-reactive opponents) are each needed (Proposition 5); additive utility defines the payoff compared.'
  evidence:
    proof: theory/theory.tex#thm:horizon
    counterexamples: theory/theory.tex#prop:needed
    experiment: E5
  status: pending
- id: C5
  text: 'Reports carry advance information that delayed measurements cannot supply: the protected controller delivers more service value than
    a measurement-only controller, increasingly so as measurement delay grows.'
  evidence:
    experiment: E1 (H1a
    H1b): null
  status: pending
- id: C6
  text: 'A learned controller that uses reports without the full-decision price is manipulated: a deviating tenant gains and honest tenants lose
    on-time traffic.'
  evidence:
    experiment: E2 (H2a
    H2c): null
  status: pending
- id: C7
  text: Under the full-decision price no misreport pays in any tested interval (certified), and learning tenants converge to truthful reports.
  evidence:
    experiment: E3 (H3a
    H3b): null
  status: pending
- id: C8
  text: The protection costs at most a small welfare gap relative to an unconstrained learned controller under truthful reports, and honest payments
    are a stated fraction of service value.
  evidence:
    experiment: E4 (H4a
    H4b: null
    H4c): null
  status: pending
- id: C9
  text: Measurement-only retraining leaves the controller bit-identical after a period of false reports; retraining on stored reports does not.
  evidence:
    experiment: E5 (H5a
    H5b): null
  status: pending
- id: C10
  text: The mechanism and its pricing scale to n=6 and n=9 tenants within the 1-s interval.
  evidence:
    experiment: E6
  status: pending
- id: C11
  text: In 5G-LENA, the PRB shift obtained by a manipulator under unprotected control reduces honest slices' delivered traffic, and the protected
    design avoids it.
  evidence:
    experiment: E7
  status: pending
