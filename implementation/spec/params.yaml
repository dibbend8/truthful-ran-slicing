# Defaults (plan section 8); calibration on training dates may adjust GBR fractions then load, in that order.
network: {B: 106, interval_s: 1.0, slot_ms: 1, scs_khz: 15, bandwidth_mhz: 20, re_per_prb_slot: 132, bler: 0.1}
mechanism: {gamma_fairness: 0.2, eta_headroom: 2.0, quotas: integer_floor}
classes:
  # D1 (orchestrator, 2026-10-19; TRAIN-only, the pre-declared first adjustment step "GBR fractions first"): every class's
  # GBR fraction is scaled by 0.8 (was 0.5 / 0.8 / 0.2). TRAIN evidence (code/STATUS.md §5.2, experiments/diag_gbr_sweep.py,
  # 180 TRAIN windows, n = 3): gbr_outage 0.077 -> 0.029 (limit 0.05), frac_weights_change_quota 0.791 -> 0.868,
  # mean_weighted_share 0.313 -> 0.393; all five regime targets pass (scale 0.9 passed only marginally, outage 0.0495).
  video: {gbr_x_mu: 0.40, mbr_x_mu: 3, ceiling_x_mu: 5, tariff_per_mbit: 1.0, delay_budget_ms: 2002}
  urllc: {gbr_x_mu: 0.64, mbr_x_mu: 3, ceiling_x_mu: 5, tariff_per_mbit: 3.0, delay_budget_ms: 150}
  mmtc:  {gbr_x_mu: 0.16, mbr_x_mu: 4, ceiling_x_mu: 8, tariff_per_mbit: 0.5, delay_budget_ms: 300}
# D2 (orchestrator, 2026-10-19; pre-registered): per-date offered-load normalization. For every date of every split the
# integer viewer/user/device count of each tenant is set so the date's mean offered traffic equals
# share x rho x B x rbar_TRAIN (shares split equally among the tenants of a class; rbar_TRAIN = TRAIN mean per-PRB rate);
# offered traffic only, identical for all arms, TEST only after the freeze (slicemech.data.calibrate.counts_for_date).
load: {rho: 0.9, shares: {video: 0.6, urllc: 0.3, mmtc: 0.1}, rule: per_date}
information: {measurement_delay_s: 2, measurement_delay_sweep_s: [1, 2, 5, 15], report_lead_ms: 50, video_lead_time_s: 4.004, video_lead_sweep_s: [0, 1.05, 4.004]}
windows: {length_s: 200, warmup_s: 40}
n_tenants: {main: 3, scaling: [6, 9]}
training: {algorithm: PPO contextual bandit, iterations: 400, seeds_main: 5, seeds_sweeps: 3, counterfactual_samples: 4, clip: 0.2, lr: 3.0e-4}
regime_targets: {frac_sumH_gt_B_min: 0.6, frac_all_caps_fit_max: 0.05, frac_weights_change_quota_min: 0.5, mean_weighted_share_min: 0.25, gbr_outage_max: 0.05}
